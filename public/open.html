<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>Open report · Performance Desk</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #f3f5f9; background: #070809; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); padding: clamp(20px, 6vw, 32px); border: 1px solid #2d3036; border-radius: 20px; background: linear-gradient(150deg, #15171c, #0b0c0e 65%); }
    .brand { margin: 0 0 28px; color: #c6fa74; font-size: 14px; font-weight: 650; }
    h1 { margin: 0 0 28px; font-size: 30px; letter-spacing: -0.8px; }
    label { display: block; margin-bottom: 9px; color: #cdd3db; font-size: 14px; }
    input, button { width: 100%; min-height: 48px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #5d636d; background: #0f1013; color: white; padding: 10px 12px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #56e8f4; outline-offset: 3px; }
    button { margin-top: 16px; border: 0; background: #c6fa74; color: #14210b; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.65; cursor: wait; }
    .report-file { margin-top: 26px; padding-top: 18px; border-top: 1px solid #2d3036; }
    .report-file p { color: #b0b5c0; font-size: 13px; line-height: 1.5; margin-bottom: 0; }
    input[type="file"]::file-selector-button { margin-right: 10px; padding: 5px 8px; border: 0; border-radius: 4px; cursor: pointer; }
    #status { color: #ffb9ad; font-size: 14px; line-height: 1.5; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Performance Desk</p>
    <h1>Open your report</h1>
    <form id="access">
      <label for="code">Access code</label>
      <input id="code" type="password" autocomplete="one-time-code" maxlength="128" required>
      <button id="open" type="submit">Open report</button>
    </form>
    <div class="report-file">
      <label for="report-file">Encrypted report file</label>
      <input id="report-file" type="file" accept=".performance-desk" aria-describedby="file-help">
      <p id="file-help">Choose your report file once on this browser. It opens locally.</p>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module">
    const fragment = location.hash.slice(1);
    const savedReport = "daily-coach-wrapped-report";
    const file = document.getElementById("report-file");
    const form = document.getElementById("access");
    const button = document.getElementById("open");
    const status = document.getElementById("status");
    const code = document.getElementById("code");
    const decode = value => Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), character => character.charCodeAt(0));
    const maximumPackageSize = 2_001_024;

    function parseEnvelope(value) {
      if (!value || value.length > maximumPackageSize) return null;
      const input = new URLSearchParams(value);
      const fields = {
        salt: /^[A-Za-z0-9_-]{22}$/,
        wrapiv: /^[A-Za-z0-9_-]{16}$/,
        wrappedkey: /^[A-Za-z0-9_-]{64}$/,
        iv: /^[A-Za-z0-9_-]{16}$/,
        data: /^[A-Za-z0-9_-]{1,2000000}$/,
      };
      if (!Object.entries(fields).every(([name, pattern]) => pattern.test(input.get(name) || ""))) return null;
      return new URLSearchParams(Object.keys(fields).map(name => [name, input.get(name)]));
    }

    function savedEnvelope() {
      try { return localStorage.getItem(savedReport); } catch { return null; }
    }

    let params = parseEnvelope(fragment || savedEnvelope());
    function renderStatus(message) {
      status.textContent = message;
      code.disabled = button.disabled = !params;
    }
    renderStatus(params ? "" : "Choose your encrypted report file or open a complete private report link.");

    // The file is read in the browser and never submitted to a server.
    let selection = 0;
    file.addEventListener("change", async () => {
      const picked = file.files[0];
      if (!picked) return;
      const request = ++selection;
      params = null;
      renderStatus("Reading report file…");
      try {
        if (picked.size <= maximumPackageSize) {
          const envelope = parseEnvelope((await picked.text()).trim());
          if (request !== selection) return;
          params = envelope;
        }
      } catch {
        if (request !== selection) return;
      }
      renderStatus(params ? "Report file selected. Enter your access code." : "This file could not be read as an encrypted Performance Desk report.");
      if (params) code.focus();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!params || button.disabled) return;
      const envelope = params;
      button.disabled = true;
      file.disabled = true;
      button.textContent = "Opening…";
      status.textContent = "";
      try {
        const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.value.trim()), "PBKDF2", false, ["deriveKey"]);
        const wrappingKey = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: decode(envelope.get("salt")), iterations: 600000, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: decode(envelope.get("wrapiv")), additionalData: new TextEncoder().encode("daily-coach-code-v1") }, wrappingKey, decode(envelope.get("wrappedkey"))));
        if (bytes.length !== 32) throw new Error("Invalid key");
        const reportKey = await crypto.subtle.importKey("raw", bytes, "AES-GCM", false, ["decrypt"]);
        await crypto.subtle.decrypt({ name: "AES-GCM", iv: decode(envelope.get("iv")), additionalData: new TextEncoder().encode("daily-coach-v1") }, reportKey, decode(envelope.get("data")));
        const key = btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        const target = new URL("./", location.href);
        target.search = "";
        target.hash = new URLSearchParams({ key, iv: envelope.get("iv"), data: envelope.get("data") }).toString();
        try { localStorage.setItem(savedReport, envelope.toString()); } catch { /* A report can open without browser storage. */ }
        code.value = "";
        location.replace(target.href);
      } catch {
        status.textContent = "The code could not open this report. Check the code and try again.";
        button.disabled = false;
        file.disabled = false;
        button.textContent = "Open report";
        code.focus();
      }
    });
  </script>
</body>
</html>
